<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0a0a0a"/>
  <!-- Decorative subtle tech ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#262626" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a3e635" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  
  <!-- Dumbbell Icon & AI Sparkle in FitAI Lime -->
  <g transform="translate(106, 126)">
    <!-- Dumbbell Bar -->
    <rect x="70" y="125" width="160" height="26" rx="13" fill="#a3e635"/>
    
    <!-- Left Weight Plates -->
    <rect x="35" y="60" width="30" height="156" rx="14" fill="#a3e635"/>
    <rect x="10" y="85" width="20" height="106" rx="10" fill="#bef264"/>
    
    <!-- Right Weight Plates -->
    <rect x="235" y="60" width="30" height="156" rx="14" fill="#a3e635"/>
    <rect x="270" y="85" width="20" height="106" rx="10" fill="#bef264"/>
    
    <!-- Inner Collar -->
    <rect x="65" y="105" width="10" height="66" rx="5" fill="#171717" stroke="#a3e635" stroke-width="3"/>
    <rect x="225" y="105" width="10" height="66" rx="5" fill="#171717" stroke="#a3e635" stroke-width="3"/>

    <!-- AI Sparkle star top right -->
    <path d="M 270 20 Q 270 50, 240 50 Q 270 50, 270 80 Q 270 50, 300 50 Q 270 50, 270 20 Z" fill="#a3e635"/>
  </g>
</svg>
